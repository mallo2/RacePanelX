name: Dependabot weekly batch

# How it works:
#  1. Runs when the "Dependabot Updates" workflow finishes (or manually).
#  2. Waits for the checks of each open Dependabot PR and keeps the green ones.
#  3. Merges those branches into a deps/batch-* branch, regenerates the lockfile
#     with npm install, then opens ONE grouped PR (which triggers your CI).
#  4. When the grouped PR is merged, closes the individual PRs with a comment
#     "merged into #XXX". If it is rejected/closed without merging, the
#     individual PRs are left untouched.

on:
  workflow_run:
    workflows: ["Dependabot Updates"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    types: [closed]

jobs:
  build-batch:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Prevents two batches from running in parallel (Dependabot Updates can trigger several times)
    concurrency:
      group: dependabot-batch-build
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # PAT (or GitHub App token) required so that CI runs on the grouped PR.
      # Must exist as both an Actions secret AND a Dependabot secret.
      GH_TOKEN: ${{ secrets.BATCH_PAT }}
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.BATCH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*   # adjust to your version (or node-version-file: .nvmrc)

      - name: Skip if a batch is already open
        id: guard
        run: |
          open=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("deps/batch-"))] | length')
          if [ "$open" -gt 0 ]; then
            echo "A batch is already open, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the batch
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="deps/batch-$(date +%F-%H%M)"
          git checkout -b "$BRANCH"

          merged=()

          for pr in $(gh pr list --author "app/dependabot" --state open --base "$BASE" \
                        --json number --jq '.[].number'); do
            echo "::group::PR #$pr"

            # Waits for checks to finish; exit code 0 = everything is green
            if ! gh pr checks "$pr" --watch --interval 30 >/dev/null 2>&1; then
              echo "Checks not green (or missing): PR skipped."
              echo "::endgroup::"
              continue
            fi

            ref=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            git fetch origin "$ref"

            ok=0
            if git merge --no-ff --no-commit "origin/$ref" >/dev/null 2>&1; then
              ok=1
            else
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ "$conflicts" = "package-lock.json" ]; then
                # Conflict only on the lockfile: keep ours,
                # it will be regenerated by npm install at the end.
                git checkout --ours package-lock.json
                git add package-lock.json
                ok=1
              else
                echo "Conflict on: $conflicts: PR skipped."
                git merge --abort
              fi
            fi

            if [ "$ok" -eq 1 ]; then
              git commit --no-edit -m "Merge Dependabot PR #$pr ($ref)" || true
              merged+=("$pr")
              echo "PR #$pr added to the batch."
            fi
            echo "::endgroup::"
          done

          if [ "${#merged[@]}" -lt 2 ]; then
            echo "Fewer than 2 green and compatible PRs (${#merged[@]}): no batch created."
            exit 0
          fi

          # Regenerates the lockfile from the merged package.json
          if ! npm install --ignore-scripts; then
            echo "::error::npm install failed on the batch, aborting."
            exit 1
          fi
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore(deps): regenerate lockfile"

          git push origin "$BRANCH"

          csv=$(IFS=,; echo "${merged[*]}")
          list=$(printf -- "- #%s\n" "${merged[@]}")
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Weekly batch of Dependabot updates whose checks were green." \
            "$list" \
            "If this PR is merged, the PRs above will be closed automatically. Otherwise they are left unchanged." \
            "<!-- batch-prs:${csv} -->")

          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore(deps): weekly dependency batch" \
            --body "$body"

  cleanup:
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'deps/batch-')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BATCH_NUMBER: ${{ github.event.pull_request.number }}
      BATCH_BODY: ${{ github.event.pull_request.body }}
      BATCH_REF: ${{ github.event.pull_request.head.ref }}
      MERGED: ${{ github.event.pull_request.merged }}
    steps:
      - name: Close the individual PRs included in the batch
        if: env.MERGED == 'true'
        run: |
          ids=$(printf '%s' "$BATCH_BODY" | grep -oE 'batch-prs:[0-9,]+' | cut -d: -f2)
          for id in ${ids//,/ }; do
            echo "Closing #$id"
            gh pr close "$id" \
              --comment "This update was merged into PR #${BATCH_NUMBER}. Closing automatically." \
              || echo "Could not close #$id (already closed?)"
          done

      - name: Delete the batch branch
        run: |
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${BATCH_REF}" \
            || echo "Branch already deleted."
