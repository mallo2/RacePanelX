name: Dependabot weekly batch

# How it works:
#  1. Runs when the "Dependabot Updates" workflow finishes (or manually).
#  2. Collects open Dependabot PRs (+ PRs of the batch about to be replaced),
#     waits for their checks and keeps the green ones.
#  3. Merges those branches into a deps/batch-* branch, regenerates the lockfile
#     with npm install, then opens ONE grouped PR (which triggers your CI).
#  4. Right after creation, the individual PRs included in the batch are closed
#     with a comment "included in #XXX", and any previous open batch is closed
#     (replaced), like Dependabot does when .15 becomes .16.
#  5. If the batch is closed WITHOUT being merged (and not replaced), the
#     individual PRs are reopened through "@dependabot reopen".
#     If it is merged, nothing else to do: they are already closed.

on:
  workflow_run:
    workflows: ["Dependabot Updates"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    types: [closed]

jobs:
  build-batch:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Prevents two batches from running in parallel
    concurrency:
      group: dependabot-batch-build
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # PAT (or GitHub App token) required so that CI runs on the grouped PR
      # and so that Dependabot accepts our commands.
      # Must exist as both an Actions secret AND a Dependabot secret.
      GH_TOKEN: ${{ secrets.BATCH_PAT }}
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.BATCH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*   # adjust to your version (or node-version-file: .nvmrc)

      - name: Build the batch
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --- Batches currently open: they will be replaced -------------------
          old_batches=$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("deps/batch-")) | .number')

          # PRs already included in those batches (closed by a previous run)
          old_prs=""
          for ob in $old_batches; do
            ids=$(gh pr view "$ob" --json body --jq .body \
                  | grep -oE 'batch-prs:[0-9,]+' | cut -d: -f2 | tr ',' ' ')
            old_prs="$old_prs $ids"
          done

          # Candidates: open Dependabot PRs first (most recent versions win),
          # then PRs of the previous batch (stale ones will conflict and be skipped).
          open_prs=$(gh pr list --author "app/dependabot" --state open --base "$BASE" \
                       --json number --jq '.[].number')
          candidates=$(printf '%s\n' $open_prs $old_prs | awk 'NF && !seen[$0]++')

          BRANCH="deps/batch-$(date +%F-%H%M)"
          git checkout -b "$BRANCH"

          merged=()

          for pr in $candidates; do
            echo "::group::PR #$pr"

            state=$(gh pr view "$pr" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              echo "Already merged: skipped."
              echo "::endgroup::"
              continue
            fi

            # Waits for checks to finish; exit code 0 = everything is green
            if ! gh pr checks "$pr" --watch --interval 30 >/dev/null 2>&1; then
              echo "Checks not green (or missing): PR skipped."
              echo "::endgroup::"
              continue
            fi

            ref=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            # pull/N/head still exists even if the branch was deleted on close
            if ! git fetch origin "pull/$pr/head"; then
              echo "Cannot fetch PR head: skipped."
              echo "::endgroup::"
              continue
            fi

            ok=0
            if git merge --no-ff --no-commit FETCH_HEAD >/dev/null 2>&1; then
              ok=1
            else
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ "$conflicts" = "package-lock.json" ]; then
                # Conflict only on the lockfile: keep ours,
                # it will be regenerated by npm install at the end.
                git checkout --ours package-lock.json
                git add package-lock.json
                ok=1
              else
                echo "Conflict on: $conflicts: PR skipped."
                git merge --abort
              fi
            fi

            if [ "$ok" -eq 1 ]; then
              git commit --no-edit -m "Merge Dependabot PR #$pr ($ref)" || true
              merged+=("$pr")
              echo "PR #$pr added to the batch."
            fi
            echo "::endgroup::"
          done

          if [ "${#merged[@]}" -lt 2 ]; then
            echo "Fewer than 2 green and compatible PRs (${#merged[@]}): no batch created."
            exit 0
          fi

          # Regenerates the lockfile from the merged package.json
          if ! npm install --ignore-scripts; then
            echo "::error::npm install failed on the batch, aborting."
            exit 1
          fi
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore(deps): regenerate lockfile"

          git push origin "$BRANCH"

          csv=$(IFS=,; echo "${merged[*]}")
          list=$(printf -- "- #%s\n" "${merged[@]}")
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Weekly batch of Dependabot updates whose checks were green." \
            "$list" \
            "The PRs above are closed while this batch is open. If this PR is merged they stay closed; if it is rejected they are reopened." \
            "<!-- batch-prs:${csv} -->")

          new_url=$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "chore(deps): weekly dependency batch" \
            --body "$body") || { echo "::error::PR creation failed"; exit 1; }
          new_number="${new_url##*/}"
          echo "New batch: #$new_number"

          # --- Replace previous batches ----------------------------------------
          for old in $old_batches; do
            echo "Replacing old batch #$old"
            # Remove the marker so that the cleanup job does NOT reopen its PRs
            gh pr edit "$old" --body "Replaced by #${new_number}." || true
            gh pr close "$old" --delete-branch \
              --comment "Replaced by #${new_number} (new batch with the latest Dependabot updates)." \
              || echo "Could not close #$old"
          done

          # --- Close the individual PRs now included in the new batch ----------
          for pr in "${merged[@]}"; do
            state=$(gh pr view "$pr" --json state --jq .state)
            if [ "$state" = "OPEN" ]; then
              echo "Closing #$pr"
              gh pr close "$pr" \
                --comment "Included in batch PR #${new_number}. Closing automatically (reopened if the batch is rejected)." \
                || echo "Could not close #$pr"
            fi
          done

  cleanup:
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'deps/batch-')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    env:
      # PAT so that "@dependabot reopen" is taken into account
      GH_TOKEN: ${{ secrets.BATCH_PAT }}
      GH_REPO: ${{ github.repository }}
      BATCH_NUMBER: ${{ github.event.pull_request.number }}
      BATCH_BODY: ${{ github.event.pull_request.body }}
      BATCH_REF: ${{ github.event.pull_request.head.ref }}
      MERGED: ${{ github.event.pull_request.merged }}
    steps:
      # Batch closed without merge and NOT replaced (marker still in the body):
      # give the individual PRs back to Dependabot.
      - name: Reopen the individual PRs if the batch was rejected
        if: env.MERGED != 'true'
        run: |
          ids=$(printf '%s' "$BATCH_BODY" | grep -oE 'batch-prs:[0-9,]+' | cut -d: -f2 || true)
          for id in ${ids//,/ }; do
            echo "Reopening #$id"
            gh pr comment "$id" --body "@dependabot reopen" \
              || echo "Could not comment on #$id"
          done

      - name: Delete the batch branch
        run: |
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${BATCH_REF}" \
            || echo "Branch already deleted."
